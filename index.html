<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Page — It's Live</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
      color: #fff;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      max-width: 480px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }
    .wave { font-size: 3.5rem; margin-bottom: 0.5rem; }
    h1 { font-size: 2rem; margin-bottom: 0.75rem; }
    p { font-size: 1.05rem; opacity: 0.9; line-height: 1.5; }
    .status {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.5rem 1.25rem;
      background: #22c55e;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .meta { margin-top: 1.5rem; font-size: 0.8rem; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="card">
    <div class="wave">🏄</div>
    <h1>It's Live</h1>
    <p>If you're reading this, your hosting setup is working. Ride's good to go.</p>
    <span class="status">● Online</span>
    <div class="meta" id="ts"></div>
  </div>
  <script>
    document.getElementById('ts').textContent = 'Loaded ' + new Date().toLocaleString();
  </script>
</body>
</html>
